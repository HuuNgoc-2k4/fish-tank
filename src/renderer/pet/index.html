<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
<title>Fish Tank - Pet</title>
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: none; }
  canvas { display: block; }
  #menu { position: fixed; width: 200px; padding: 6px; border-radius: 10px; background: #fff; color: #1c1c1e;
          border: 1px solid #e3e3e8; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  #menu[hidden] { display: none; }
  #menu .head { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 8px 4px; }
  #menu .head span { color: #6e6e76; font-size: 12px; }
  #menu .bar { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 8px; padding: 2px 8px; color: #6e6e76; font-size: 12px; }
  #menu .bar i { height: 4px; border-radius: 2px; background: #ececef; overflow: hidden; }
  #menu .bar b { display: block; height: 100%; border-radius: 2px; background: #1c1c1e; }
  #menu hr { border: 0; border-top: 1px solid #ececef; margin: 6px 0; }
  #menu button { display: block; width: 100%; text-align: left; padding: 6px 8px; border: 0; border-radius: 6px;
                 background: none; color: inherit; font: inherit; cursor: pointer; }
  #menu button:hover { background: #f2f2f5; }
</style>
<canvas id="c"></canvas>
<div id="menu" hidden>
  <div class="head"><b id="mName"></b><span id="mType"></span></div>
  <div class="bar">No bụng <i><b id="bFood"></b></i></div>
  <div class="bar">Năng lượng <i><b id="bEnergy"></b></i></div>
  <div class="bar">Vui vẻ <i><b id="bFun"></b></i></div>
  <hr>
  <button data-cmd="feed">Cho ăn</button>
  <button data-cmd="ball">Chơi bóng</button>
  <button data-cmd="laser">Đuổi chấm đỏ</button>
  <button data-cmd="sleep" id="mSleep">Đi ngủ</button>
  <button data-cmd="shoo">Đuổi đi chỗ khác</button>
</div>
<script src="../../core/mood.js"></script>
<script src="../../core/pet.js"></script>
<script src="../../core/pet-draw.js"></script>
<script src="../../core/pet-fancy.js"></script>
<script src="pet.js"></script>
