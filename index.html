<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Fish Tank</title>
<style>html,body{margin:0;overflow:hidden;background:transparent}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="tank.js"></script>
<script>
const bridge = window.api || { capture() {}, on() {} }; // no preload when opened in a plain browser
const c = document.getElementById('c'), ctx = c.getContext('2d');
const s = makeTank(innerWidth, innerHeight);
for (let i = 0; i < 3; i++) addFish(s);

function resize() {
  const dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  s.w = innerWidth; s.h = innerHeight;
}
addEventListener('resize', resize); resize();
console.log('tank started', s.w, s.h, 'fish:', s.fish.length);

// Feed button: the only part of the overlay that catches the mouse (unless "interactive" mode is on).
const btn = () => ({ x: s.w - 50, y: s.h - 50, r: 28 });
let over = false, interactive = false;
const hit = e => { const b = btn(); return Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r; };
const feedTop = () => drop(s, 60 + Math.random() * (s.w - 120), -10, 10);

addEventListener('mousemove', e => {
  const h = hit(e);
  if (h !== over) { over = h; bridge.capture(h); }
});
addEventListener('click', e => {
  if (hit(e)) feedTop();
  else if (interactive) drop(s, e.clientX, e.clientY);
});
bridge.on('feed', feedTop);
bridge.on('add', () => s.fish.length < 12 && addFish(s));
bridge.on('interactive', v => { interactive = v; });

let last = performance.now();
(function loop(now) {
  step(s, Math.min(0.05, (now - last) / 1000)); last = now;
  draw(ctx, s);
  const b = btn();
  ctx.save();
  ctx.strokeStyle = '#ffb300'; ctx.shadowColor = '#ffb300'; ctx.shadowBlur = over ? 22 : 8; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.29); ctx.globalAlpha = over ? 1 : 0.45; ctx.stroke();
  ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 6.29); ctx.stroke();
  ctx.restore();
  requestAnimationFrame(loop);
})(last);
</script>
